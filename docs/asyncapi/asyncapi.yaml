asyncapi: 2.6.0
id: 'urn:wangnong:api:2026'

info:
  title: 鸿蒙慧田 (Wangnong) Event & API Spec
  version: 2.0.0
  description: |
    本文档描述 Wangnong 系统的 **HTTP 业务 API** 与 **MQTT 实时协议** 规范。

    系统采用 HTTP + MQTT 混合通信架构：
    - **HTTP**：用于基础业务数据访问（登录、设备信息、告警管理等）。
    - **MQTT**：专用于双向实时通信（传感器秒级上报、控制指令下发、突发告警推送）。
  contact:
    name: Wangnong Team
    url: https://github.com/MCHimcd/Wangnong
    email: support@wangnong.example.com
  license:
    name: MIT

tags:
  - name: HTTP
    description: HTTP 业务 API 接口
  - name: MQTT
    description: MQTT 实时消息协议

servers:
  http-backend:
    url: http://localhost:8080
    protocol: http
    description: Spring Boot 后端 HTTP 服务（端口 8080，context-path /api）
  mqtt-broker:
    url: broker.emqx.io:1883
    protocol: mqtt
    description: MQTT Broker（公共测试节点，生产环境请替换为自建 Broker）
    security:
      - {}

defaultContentType: application/json

# ============================================================
# HTTP Channels（使用 HTTP binding，每个 channel 对应一个 REST 端点）
# ============================================================
channels:

  # ---------- 用户认证 ----------
  /api/v1/auth/login:
    description: 用户账号密码登录，返回 JWT Token
    bindings:
      http:
        type: request
    publish:
      operationId: userLogin
      summary: 用户登录
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/LoginRequest'
    subscribe:
      operationId: userLoginResponse
      summary: 登录响应
      message:
        $ref: '#/components/messages/LoginResponse'

  /api/v1/auth/send-verification-code:
    description: 发送手机验证码（测试环境固定验证码为 1234）
    bindings:
      http:
        type: request
    publish:
      operationId: sendVerificationCode
      summary: 发送验证码
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/SendVerificationCodeRequest'
    subscribe:
      operationId: sendVerificationCodeResponse
      summary: 发送验证码响应
      message:
        $ref: '#/components/messages/SendVerificationCodeResponse'

  /api/v1/auth/register:
    description: 新用户注册（手机号 + 验证码 + 密码）
    bindings:
      http:
        type: request
    publish:
      operationId: userRegister
      summary: 用户注册
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/RegisterRequest'
    subscribe:
      operationId: userRegisterResponse
      summary: 注册响应
      message:
        $ref: '#/components/messages/RegisterResponse'

  /api/v1/auth/forgot-password:
    description: 找回密码（手机号 + 验证码 + 新密码）
    bindings:
      http:
        type: request
    publish:
      operationId: forgotPassword
      summary: 找回密码
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/ForgotPasswordRequest'
    subscribe:
      operationId: forgotPasswordResponse
      summary: 找回密码响应
      message:
        $ref: '#/components/messages/ForgotPasswordResponse'

  /api/v1/auth/profile:
    description: 获取或更新当前登录用户的个人资料
    bindings:
      http:
        type: request
    publish:
      operationId: updateProfile
      summary: 更新用户资料 (PUT)
      bindings:
        http:
          method: PUT
      message:
        $ref: '#/components/messages/UpdateProfileRequest'
    subscribe:
      operationId: getProfile
      summary: 获取用户资料 (GET)
      message:
        $ref: '#/components/messages/ProfileResponse'

  /api/v1/auth/password:
    description: 修改当前用户密码
    bindings:
      http:
        type: request
    publish:
      operationId: changePassword
      summary: 修改密码 (PUT)
      bindings:
        http:
          method: PUT
      message:
        $ref: '#/components/messages/ChangePasswordRequest'
    subscribe:
      operationId: changePasswordResponse
      summary: 修改密码响应
      message:
        $ref: '#/components/messages/GenericSuccessResponse'

  /api/v1/auth/avatar/use-fixed:
    description: 使用系统内置头像
    bindings:
      http:
        type: request
    publish:
      operationId: useFixedAvatar
      summary: 使用固定头像 (POST)
      bindings:
        http:
          method: POST
      message:
        name: EmptyBody
        payload:
          type: object
    subscribe:
      operationId: useFixedAvatarResponse
      summary: 使用固定头像响应
      message:
        $ref: '#/components/messages/ProfileResponse'

  /api/v1/auth/logout:
    description: 注销当前登录会话
    bindings:
      http:
        type: request
    publish:
      operationId: logout
      summary: 用户注销 (POST)
      bindings:
        http:
          method: POST
      message:
        name: EmptyBody
        payload:
          type: object
    subscribe:
      operationId: logoutResponse
      summary: 注销响应
      message:
        $ref: '#/components/messages/GenericSuccessResponse'

  /api/v1/nodes:
    description: 获取当前账号下的节点列表
    bindings:
      http:
        type: request
    subscribe:
      operationId: listNodes
      summary: 查询节点列表 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/NodeListResponse'

  /api/v1/nodes/{node_id}:
    description: 获取指定节点的详细信息
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getNode
      summary: 查询节点详情 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/NodeDetailResponse'

  /api/v1/alerts/list:
    description: 分页查询告警记录列表
    bindings:
      http:
        type: request
    publish:
      operationId: queryAlerts
      summary: 查询告警列表 (POST)
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/AlertListRequest'
    subscribe:
      operationId: alertListResponse
      summary: 告警列表响应
      message:
        $ref: '#/components/messages/AlertListResponse'

  /api/v1/alerts/handle:
    description: 处理（确认/忽略）指定告警
    bindings:
      http:
        type: request
    publish:
      operationId: handleAlert
      summary: 处理告警 (POST)
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/HandleAlertRequest'
    subscribe:
      operationId: handleAlertResponse
      summary: 处理告警响应
      message:
        $ref: '#/components/messages/HandleAlertResponse'

  /api/v1/sensors/{node_id}/history:
    description: 查询传感器历史数据（时序图表用）
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getSensorHistory
      summary: 查询传感器历史 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/SensorHistoryResponse'

  /api/v1/nodes/{node_id}/sensor-meta:
    description: 获取指定节点支持的传感器元数据（类型、单位、图标、阈值等）
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getSensorMeta
      summary: 查询传感器元数据 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/SensorMetaResponse'

  /api/v1/nodes/{node_id}/equipment-meta:
    description: 获取指定节点支持的执行器元数据（名称、图标、是否可控等）
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getEquipmentMeta
      summary: 查询节点/执行器元数据 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/EquipmentMetaResponse'

  /api/v1/agri-qa/chat:
    description: 农业知识问答聊天接口（文字+可选图片）
    bindings:
      http:
        type: request
    publish:
      operationId: sendAgriQA
      summary: 发送农业知识问题 (POST)
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/AgriQARequest'
    subscribe:
      operationId: agriQAResponse
      summary: 农业知识问答回复
      message:
        $ref: '#/components/messages/AgriQAResponse'

  /api/v1/equipment/stats:
    description: 查询执行器运行统计（时段汇总+趋势图）
    bindings:
      http:
        type: request
    publish:
      operationId: getEquipmentStats
      summary: 查询执行器统计 (POST)
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/EquipmentStatsRequest'
    subscribe:
      operationId: equipmentStatsResponse
      summary: 执行器统计响应
      message:
        $ref: '#/components/messages/EquipmentStatsResponse'

  /api/v1/traceability/scan:
    description: 溯源码扫码记录
    bindings:
      http:
        type: request
    publish:
      operationId: uploadTraceCode
      summary: 上传溯源码 (POST)
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/TraceabilityScanRequest'
    subscribe:
      operationId: traceabilityScanResponse
      summary: 溯源码扫码响应
      message:
        $ref: '#/components/messages/TraceabilityScanResponse'

  # ---------- 管理员 API ----------
  /api/v1/admin/nodes:
    description: 管理员创建新节点（需 admin 角色）
    bindings:
      http:
        type: request
    publish:
      operationId: adminCreateNode
      summary: 创建节点 (POST)
      bindings:
        http:
          method: POST
      message:
        $ref: '#/components/messages/AdminNodeRequest'
    subscribe:
      operationId: adminCreateNodeResponse
      summary: 创建节点响应
      message:
        $ref: '#/components/messages/GenericSuccessResponse'

  /api/v1/admin/nodes/{node_id}:
    description: 管理员更新或删除指定节点（需 admin 角色）
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    publish:
      operationId: adminUpdateNode
      summary: 更新节点 (PUT)
      bindings:
        http:
          method: PUT
      message:
        $ref: '#/components/messages/AdminNodeRequest'
    subscribe:
      operationId: adminDeleteNode
      summary: 删除节点 (DELETE)
      bindings:
        http:
          method: DELETE
      message:
        $ref: '#/components/messages/GenericSuccessResponse'

  /api/v1/admin/users:
    description: 管理员查询用户列表（需 admin 角色）
    bindings:
      http:
        type: request
    subscribe:
      operationId: adminListUsers
      summary: 查询用户列表 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/AdminUserListResponse'

  /api/v1/admin/users/{user_id}/role:
    description: 管理员修改用户角色（需 admin 角色）
    parameters:
      user_id:
        description: 用户 ID
        schema:
          type: integer
          example: 1
    bindings:
      http:
        type: request
    publish:
      operationId: adminUpdateUserRole
      summary: 修改用户角色 (PUT)
      bindings:
        http:
          method: PUT
      message:
        $ref: '#/components/messages/AdminUpdateRoleRequest'
    subscribe:
      operationId: adminUpdateUserRoleResponse
      summary: 修改用户角色响应
      message:
        $ref: '#/components/messages/GenericSuccessResponse'

  /api/v1/cameras/{node_id}/live:
    description: 获取指定节点摄像头的实时直播流信息
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getCameraLive
      summary: 查询直播流 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/CameraLiveResponse'

  /api/v1/cameras/{node_id}/playback:
    description: 获取指定节点摄像头的回放记录列表
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getCameraPlayback
      summary: 查询回放列表 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/CameraPlaybackResponse'

  /api/v1/cameras/{node_id}/keyframes:
    description: 获取指定节点摄像头的关键帧抓拍列表
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      http:
        type: request
    subscribe:
      operationId: getCameraKeyframes
      summary: 查询关键帧 (GET)
      bindings:
        http:
          method: GET
      message:
        $ref: '#/components/messages/CameraKeyframesResponse'

  # ============================================================
  # MQTT Channels
  # ============================================================

  /wangnong_2026/node/{node_id}/telemetry:
    description: |
      **节点传感器数据实时上报**（Node → Cloud/App）。
      节点每 3–5 秒发布一次，包含环境传感器读数与节点状态。
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      mqtt:
        qos: 1
        retain: false
    subscribe:
      operationId: receiveTelemetry
      summary: 接收传感器实时遥测数据
      message:
        $ref: '#/components/messages/TelemetryMessage'

  /wangnong_2026/node/{node_id}/alert:
    description: |
      **突发告警推送**（Cloud/Edge → App）。
      当检测到异常（高温、低湿等）时由后端或边侧计算节点发布。
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      mqtt:
        qos: 1
        retain: false
    subscribe:
      operationId: receiveAlert
      summary: 接收节点告警推送
      message:
        $ref: '#/components/messages/AlertMessage'

  /wangnong_2026/node/{node_id}/command:
    description: |
      **控制指令下发**（App/Cloud → Node）。
      用于远程切换节点模式或控制执行器（水泵、LED 灯、电磁阀等）。
    parameters:
      node_id:
        $ref: '#/components/parameters/nodeId'
    bindings:
      mqtt:
        qos: 1
        retain: false
    publish:
      operationId: sendCommand
      summary: 向节点下发控制指令
      message:
        $ref: '#/components/messages/CommandMessage'

# ============================================================
# Components
# ============================================================
components:

  parameters:
    nodeId:
      description: 节点唯一标识符，例如 `A03_Node_01`
      schema:
        type: string
        example: A03_Node_01

  messages:

    # ---------- HTTP Messages ----------
    LoginRequest:
      messageId: LoginRequest
      name: LoginRequest
      title: 登录请求体
      contentType: application/json
      payload:
        type: object
        required: [phone, password]
        properties:
          phone:
            type: string
            description: 手机号
            example: "13800138000"
          password:
            type: string
            format: password
            example: "Pass1234"

    LoginResponse:
      messageId: LoginResponse
      name: LoginResponse
      title: 登录响应体
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              token: eyJhbGciOiJIUzI1NiIs...
              expires_in: 3600
              role: user

    SendVerificationCodeRequest:
      messageId: SendVerificationCodeRequest
      name: SendVerificationCodeRequest
      title: 发送验证码请求体
      contentType: application/json
      payload:
        type: object
        required: [phone]
        properties:
          phone:
            type: string
            example: "13800138000"

    SendVerificationCodeResponse:
      messageId: SendVerificationCodeResponse
      name: SendVerificationCodeResponse
      title: 发送验证码响应体
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              expires_in: 300
              test_code: "1234"

    RegisterRequest:
      messageId: RegisterRequest
      name: RegisterRequest
      title: 注册请求体
      contentType: application/json
      payload:
        type: object
        required: [phone, verificationCode, password]
        properties:
          phone:
            type: string
            example: "13800138000"
          verificationCode:
            type: string
            example: "1234"
          password:
            type: string
            format: password
            example: "newPass123"

    RegisterResponse:
      messageId: RegisterResponse
      name: RegisterResponse
      title: 注册响应体
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data: null
        - name: conflict
          payload:
            code: 409
            message: phone already registered
            data: null

    ForgotPasswordRequest:
      messageId: ForgotPasswordRequest
      name: ForgotPasswordRequest
      title: 找回密码请求体
      contentType: application/json
      payload:
        type: object
        required: [phone, verificationCode, newPassword]
        properties:
          phone:
            type: string
            example: "13800138000"
          verificationCode:
            type: string
            example: "1234"
          newPassword:
            type: string
            format: password
            example: "newSecret456"

    ForgotPasswordResponse:
      messageId: ForgotPasswordResponse
      name: ForgotPasswordResponse
      title: 找回密码响应体
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data: null
        - name: not_found
          payload:
            code: 404
            message: user not found
            data: null

    UpdateProfileRequest:
      messageId: UpdateProfileRequest
      name: UpdateProfileRequest
      title: 更新用户资料请求体
      contentType: application/json
      payload:
        type: object
        properties:
          userName:
            type: string
            example: 农场主
          gender:
            type: string
            enum: [男, 女, 其他]
            example: 男
          birthDate:
            type: string
            format: date
            example: "1990-01-01"
          avatarSrc:
            type: string
            format: uri
            example: https://example.com/avatar.jpg

    ProfileResponse:
      messageId: ProfileResponse
      name: ProfileResponse
      title: 用户资料响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              userId: WangNong_001
              userName: 农场主
              phone: "13800000000"
              gender: 男
              birthDate: "1990-01-01"
              avatarSrc: https://example.com/avatar.jpg
              role: user

    AdminNodeRequest:
      messageId: AdminNodeRequest
      name: AdminNodeRequest
      title: 管理员节点操作请求体
      contentType: application/json
      payload:
        type: object
        required: [node_id, node_name]
        properties:
          node_id:
            type: string
            example: A03_Node_03
          node_name:
            type: string
            example: 3号大棚-节点03

    AdminUserListResponse:
      messageId: AdminUserListResponse
      name: AdminUserListResponse
      title: 用户列表响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              - id: 1
                phone: "13800000000"
                nickname: 农场主
                role: user
              - id: 2
                phone: "13800000001"
                nickname: 管理员
                role: admin

    AdminUpdateRoleRequest:
      messageId: AdminUpdateRoleRequest
      name: AdminUpdateRoleRequest
      title: 修改用户角色请求体
      contentType: application/json
      payload:
        type: object
        required: [role]
        properties:
          role:
            type: string
            enum: [user, admin]
            example: admin

    NodeListResponse:
      messageId: NodeListResponse
      name: NodeListResponse
      title: 节点列表响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              - id: A03_Node_01
                name: 3号大棚-节点01
                status: online

    NodeDetailResponse:
      messageId: NodeDetailResponse
      name: NodeDetailResponse
      title: 节点详情响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              id: A03_Node_01
              name: 3号大棚-节点01
              status: online
              deviceState:
                smartMode: false

    AlertListRequest:
      messageId: AlertListRequest
      name: AlertListRequest
      title: 查询告警列表请求体
      contentType: application/json
      payload:
        type: object
        properties:
          query:
            type: object
            properties:
              scene:
                type: string
                description: "startup 时返回全部未处理+最近10条已处理告警"
                example: startup
              page:
                type: integer
                minimum: 1
                example: 1
              size:
                type: integer
                minimum: 1
                maximum: 100
                example: 20
              sort_by:
                type: string
                example: timestamp
              order:
                type: string
                enum: [asc, desc]
                example: desc
              filter_type:
                type: string
                example: ""
              filter_status:
                type: string
                example: ""

    AlertListResponse:
      messageId: AlertListResponse
      name: AlertListResponse
      title: 告警列表响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data:
              total: 1
              unhandled_count: 1
              handled_recent_count: 0
              items:
                - alert_id: A10992
                  node_id: A03_Node_01
                  type: high_temp
                  type_name: 高温告警
                  level: critical
                  timestamp: 1773993650000
                  message: 当前温度38°C，超出安全阈值
                  source: environment
                  source_name: 环境监测
                  is_handled: false
                  handle_time: null

    HandleAlertRequest:
      messageId: HandleAlertRequest
      name: HandleAlertRequest
      title: 处理告警请求体
      contentType: application/json
      payload:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [alert_id]
            properties:
              alert_id:
                type: string
                example: A10992
              action:
                type: string
                enum: [handle, ignore]
                default: handle
                example: handle

    HandleAlertResponse:
      messageId: HandleAlertResponse
      name: HandleAlertResponse
      title: 处理告警响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'

    SensorHistoryResponse:
      messageId: SensorHistoryResponse
