    GenericSuccessResponse:
      messageId: GenericSuccessResponse
      name: GenericSuccessResponse
      title: 通用成功响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
        - name: success
          payload:
            code: 200
            message: success
            data: null

    ChangePasswordRequest:
      messageId: ChangePasswordRequest
      name: ChangePasswordRequest
      title: 修改密码请求体
      contentType: application/json
      payload:
        type: object
        required: [oldPassword, newPassword]
        properties:
          oldPassword:
            type: string
            format: password
            example: "oldPass123"
          newPassword:
            type: string
            format: password
            example: "newPass456"

    EquipmentStatsRequest:
      messageId: EquipmentStatsRequest
      name: EquipmentStatsRequest
      title: 执行器统计请求体
      contentType: application/json
      payload:
        type: object
        properties:
          query:
            type: object
            properties:
              equipment_type:
                type: string
                description: 执行器标识（如 water_pump、water_valve 等）
                example: water_pump
              time_range:
                type: string
                description: 时间范围（如 24h、7d）
                example: 24h

    EquipmentStatsResponse:
      messageId: EquipmentStatsResponse
      name: EquipmentStatsResponse
      title: 执行器统计响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
