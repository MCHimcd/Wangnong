                - timeLabel: "09:00"
                  value: 25.4
                - timeLabel: "10:00"
                  value: 28.3

    SensorMetaResponse:
      messageId: SensorMetaResponse
      name: SensorMetaResponse
      title: 传感器元数据响应
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApiResponse'
      examples:
