                captureTime: "2026-03-20T14:20:00"
                label: 虫害疑似
                confidence: 0.78
                thumbnailHint: "thumb://A03_Node_01/2"
                isAbnormal: true
                abnormalType: 虫害预警
                severity: critical

    # ---------- MQTT Messages ----------
    TelemetryMessage:
      messageId: TelemetryMessage
      name: TelemetryMessage
      title: 传感器遥测数据包
      summary: 节点每 3–5 秒上报一次环境传感器与节点状态
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TelemetryPayload'
      examples:
        - name: normal
          payload:
            msg_type: telemetry
            node_id: A03_Node_01
            timestamp: 1773993600000
            data:
              environment:
                temperature: 25.4
                humidity: 60.1
                soilTemp: 22.0
                soilHumidity: 45.2
                light: 15000
                co2: 450
              equipment:
                water_valve: false
                water_pump: false
                led_light: true
                camera: false
              mode: smart

    AlertMessage:
      messageId: AlertMessage
      name: AlertMessage
      title: 告警推送消息
      summary: 后端或边侧节点检测到异常时推送
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AlertPayload'
      examples:
        - name: high_temp
          payload:
            msg_type: alert
            node_id: A03_Node_01
            timestamp: 1773993650000
            data:
              alert_id: A10992
              type: high_temp
              type_name: 高温告警
              level: critical
              timestamp: 1773993650000
              message: 当前温度38°C，超出安全阈值
              source: environment
              source_name: 环境监测
              is_handled: false
              handle_time: null

    CommandMessage:
      messageId: CommandMessage
      name: CommandMessage
      title: 节点控制指令
      summary: App 或云端向节点下发控制动作
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CommandPayload'
      examples:
        - name: turn_on_pump
          payload:
            action:
              target_device: water_pump
              command: turn_on
        - name: set_smart_mode
          payload:
            action:
              target_device: mode
              command: smart

  schemas:

    ApiResponse:
      type: object
      description: 所有 HTTP 接口的统一响应结构
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务状态码，200 为成功
          example: 200
        message:
          type: string
          example: success
        data:
          description: 业务数据，失败时可为 null

    TelemetryPayload:
      type: object
      required: [msg_type, node_id, timestamp, data]
      properties:
        msg_type:
          type: string
          const: telemetry
        node_id:
          type: string
          example: A03_Node_01
        timestamp:
          type: integer
          format: int64
          description: Unix 毫秒时间戳
          example: 1773993600000
        data:
          type: object
          properties:
            environment:
              $ref: '#/components/schemas/EnvironmentData'
            equipment:
              $ref: '#/components/schemas/EquipmentState'
            mode:
              type: string
              enum: [smart, manual]
              example: smart

    AlertPayload:
      type: object
      required: [msg_type, node_id, timestamp, data]
      properties:
        msg_type:
          type: string
          const: alert
        node_id:
          type: string
          example: A03_Node_01
        timestamp:
          type: integer
          format: int64
          example: 1773993650000
        data:
          type: object
          required: [alert_id, type, level, message]
          properties:
            alert_id:
              type: string
              example: A10992
            type:
              type: string
              description: 告警类型标识
              example: high_temp
            type_name:
              type: string
              description: 告警类型中文名称
              example: 高温告警
            level:
              type: string
              enum: [info, warning, critical]
              example: critical
            timestamp:
              type: integer
              format: int64
              example: 1773993650000
            message:
              type: string
              example: 当前温度38°C，超出安全阈值
            source:
              type: string
              example: environment
            source_name:
              type: string
              example: 环境监测
            is_handled:
              type: boolean
              example: false
            handle_time:
              type: integer
              format: int64
              nullable: true
              example: null

    CommandPayload:
      type: object
      required: [action]
      properties:
        action:
          type: object
          required: [target_device, command]
          properties:
            target_device:
              type: string
              description: |
                执行器标识符。可选值：
                - `water_valve` – 电磁阀
                - `water_pump` – 水泵
                - `led_light` – LED 补光灯
                - `camera` – 摄像头
                - `mode` – 运行模式
              example: water_pump
            command:
              type: string
              description: |
                控制指令。执行器使用 `turn_on` / `turn_off`；
                模式使用 `smart` / `manual`。
              example: turn_on

    EnvironmentData:
      type: object
      description: |
        环境传感器读数（动态键值对）。
        键名由 sensor-meta 接口定义，常见键：temperature, humidity, light, co2, soilTemp, soilHumidity。
      additionalProperties:
        type: number
        format: float
      example:
        temperature: 25.4
        humidity: 60.1
        soilTemp: 22.0
        soilHumidity: 45.2
        light: 15000
        co2: 450

    EquipmentState:
      type: object
      description: |
        执行器当前开关状态（动态键值对）。
        键名由 equipment-meta 接口定义，常见键：water_valve, water_pump, led_light, camera。
      additionalProperties:
        type: boolean
      example:
        water_valve: false
        water_pump: false
        led_light: true
        camera: false
